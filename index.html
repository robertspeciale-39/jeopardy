<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070a">
<title>Cyber Jeopardy · CyberSpesh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════
   CyberSpesh Design System v3
   Inter + JetBrains Mono · tokenized themes · 4/8 rhythm
   DO NOT hardcode colours. Every colour resolves through a token.
══════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --font-display: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-body:    'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono:    'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

  /* Type scale */
  --fs-2xs: 11px; --fs-xs: 12px; --fs-sm: 13px; --fs-base: 15px; --fs-md: 16px;
  --fs-lg: 18px;  --fs-xl: 22px; --fs-2xl: 28px; --fs-3xl: 34px; --fs-4xl: 44px;

  /* Spacing rhythm (4/8) */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px; --sp-12: 48px;

  /* Radii */
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-pill: 999px;

  /* Motion */
  --ease-out: cubic-bezier(.22,.8,.3,1);
  --dur-fast: 140ms;
  --dur: 200ms;

  /* Z-index scale */
  --z-atmos: 0; --z-content: 10; --z-sticky: 60; --z-overlay: 90; --z-toast: 100;
}

/* ══════════════════════════════════════════════════════
   THEMES — five, always in this order, matrix default
══════════════════════════════════════════════════════ */
body.matrix {
  --bg: #05070a;
  --surface-1: rgba(255,255,255,.026);
  --surface-2: rgba(255,255,255,.045);
  --surface-3: rgba(255,255,255,.07);
  --line: rgba(120,235,150,.16);
  --line-strong: rgba(120,235,150,.32);
  --primary: #35d67d;
  --primary-soft: rgba(53,214,125,.14);
  --accent: #6ef2a6;
  --glow-rgba: rgba(53,214,125,.20);
  --text: #cfe6d8; --text-2: #9dc0ad; --text-dim: #7a9d88; --text-bright: #eafff2;
  --danger: #ff7a7a;
  --u1: #35d67d; --u2: #6ef2a6; --u3: #d9e85a; --u4: #ffb454; --u5: #ff7a7a;
}
body.arctic {
  --bg: #04090f;
  --surface-1: rgba(255,255,255,.03);
  --surface-2: rgba(255,255,255,.05);
  --surface-3: rgba(255,255,255,.075);
  --line: rgba(120,200,235,.17);
  --line-strong: rgba(120,200,235,.34);
  --primary: #45b8d8;
  --primary-soft: rgba(69,184,216,.15);
  --accent: #9fe0f0;
  --glow-rgba: rgba(69,184,216,.20);
  --text: #cfe4ee; --text-2: #a3c1d1; --text-dim: #7fa0b2; --text-bright: #eefaff;
  --danger: #ff8a8a;
  --u1: #45b8d8; --u2: #7ce0e8; --u3: #8fe3b8; --u4: #ffc46b; --u5: #ff8a8a;
}
body.crimson {
  --bg: #0b0406;
  --surface-1: rgba(255,255,255,.03);
  --surface-2: rgba(255,255,255,.05);
  --surface-3: rgba(255,255,255,.075);
  --line: rgba(255,120,120,.17);
  --line-strong: rgba(255,120,120,.34);
  --primary: #f2555b;
  --primary-soft: rgba(242,85,91,.15);
  --accent: #ff9b8a;
  --glow-rgba: rgba(242,85,91,.20);
  --text: #f0d4d5; --text-2: #cb9c9f; --text-dim: #a87b7e; --text-bright: #fff0f0;
  --danger: #ff6b6b;
  --u1: #f2555b; --u2: #ff9366; --u3: #ffc247; --u4: #ff85a6; --u5: #d072d8;
}
body.tokyo {
  --bg: #0b0510;
  --surface-1: rgba(255,255,255,.03);
  --surface-2: rgba(255,255,255,.05);
  --surface-3: rgba(255,255,255,.075);
  --line: rgba(255,120,175,.17);
  --line-strong: rgba(255,120,175,.34);
  --primary: #ff5c9d;
  --primary-soft: rgba(255,92,157,.15);
  --accent: #6ee7f5;
  --glow-rgba: rgba(255,92,157,.20);
  --text: #f2d5e2; --text-2: #cfa1b6; --text-dim: #ad8195; --text-bright: #fff2f7;
  --danger: #ff7a7a;
  --u1: #ff5c9d; --u2: #6ee7f5; --u3: #ffd166; --u4: #a78bfa; --u5: #6ee7a5;
}
body.galaxy {
  --bg: #0a0718;
  --surface-1: rgba(255,255,255,.03);
  --surface-2: rgba(255,255,255,.05);
  --surface-3: rgba(255,255,255,.075);
  --line: rgba(190,150,255,.17);
  --line-strong: rgba(190,150,255,.34);
  --primary: #a97bf5;
  --primary-soft: rgba(169,123,245,.16);
  --accent: #d6b4ff;
  --glow-rgba: rgba(169,123,245,.22);
  --text: #ded3f2; --text-2: #b3a5cc; --text-dim: #8f81ab; --text-bright: #f6f0ff;
  --danger: #ff8fb0;
  --u1: #a97bf5; --u2: #6ee7f5; --u3: #ffd166; --u4: #ff8fb0; --u5: #6ee7a5;
}

/* Derived tokens — shared by every theme. Use --u1s..--u5s for tinted fills. */
body {
  --u1s: color-mix(in srgb, var(--u1) 18%, transparent);
  --u2s: color-mix(in srgb, var(--u2) 18%, transparent);
  --u3s: color-mix(in srgb, var(--u3) 18%, transparent);
  --u4s: color-mix(in srgb, var(--u4) 18%, transparent);
  --u5s: color-mix(in srgb, var(--u5) 18%, transparent);
}

/* ══════════════════════════════════════════════════════
   BASE
══════════════════════════════════════════════════════ */
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: var(--fs-base);
  line-height: 1.6;
  min-height: 100dvh;
  position: relative;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: background var(--dur) var(--ease-out), color var(--dur) var(--ease-out);
}

::selection { background: var(--primary); color: var(--bg); }

:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

/* Atmosphere — ambient glow + faint grid, masked to the top of the page */
#matrix-rain {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  z-index: var(--z-atmos); opacity: .07; pointer-events: none;
}
.atmos {
  position: fixed; inset: 0; z-index: var(--z-atmos); pointer-events: none;
  background:
    radial-gradient(680px 460px at 82% -6%, var(--glow-rgba), transparent 68%),
    radial-gradient(560px 420px at 6% 62%, var(--glow-rgba), transparent 70%);
  opacity: .55;
}
.atmos::after {
  content: ''; position: absolute; inset: 0;
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 64px 64px;
  opacity: .30;
  -webkit-mask-image: radial-gradient(1100px 720px at 50% 0%, #000 30%, transparent 90%);
  mask-image: radial-gradient(1100px 720px at 50% 0%, #000 30%, transparent 90%);
}

.shell { position: relative; z-index: var(--z-content); display: grid;
         grid-template-rows: auto auto 1fr; min-height: 100dvh; }

/* ══════════════════════════════════════════════════════
   TOPBAR
══════════════════════════════════════════════════════ */
.topbar {
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px) saturate(1.3);
  -webkit-backdrop-filter: blur(14px) saturate(1.3);
  border-bottom: 1px solid var(--line);
  padding: var(--sp-3) var(--sp-6);
  display: flex; align-items: center; gap: var(--sp-4); flex-wrap: wrap;
  position: sticky; top: 0; z-index: var(--z-sticky);
}
.topbar::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--line-strong), transparent);
}
.brand { display: flex; align-items: center; gap: var(--sp-3); min-width: 0; text-decoration: none; }
.brand-mark { width: 38px; height: 38px; flex-shrink: 0; display: block; border-radius: var(--r-sm); }
.brand-text { min-width: 0; }
.brand-title {
  font-family: var(--font-display); font-weight: 700; font-size: var(--fs-lg);
  letter-spacing: -0.022em; line-height: 1.2; color: var(--text-bright);
}
.brand-sub {
  font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 500;
  color: var(--primary); letter-spacing: .10em; line-height: 1.4;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.topbar-sep { flex: 1 1 auto; }
.topbar-tag {
  font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 500;
  color: var(--text-2); letter-spacing: .08em;
  border: 1px solid var(--line); background: var(--surface-1);
  padding: 5px 10px; border-radius: var(--r-sm); white-space: nowrap;
}

/* Theme switcher */
.theme-switcher {
  display: flex; align-items: center; gap: 3px; padding: 3px;
  background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--r-pill);
}
.theme-label {
  font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 500;
  color: var(--text-dim); letter-spacing: .10em; padding: 0 var(--sp-2) 0 var(--sp-3);
}
.theme-btn {
  font-family: var(--font-body); font-size: var(--fs-xs); font-weight: 600;
  color: var(--text-2); background: transparent; border: 0; border-radius: var(--r-pill);
  padding: 7px 12px; min-height: 32px; cursor: pointer; white-space: nowrap;
  transition: color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
}
.theme-btn:hover { color: var(--text-bright); background: var(--surface-2); }
.theme-btn.active { color: var(--bg); background: var(--primary); font-weight: 700; }

/* ══════════════════════════════════════════════════════
   NAV TABS (delete if the app is single-view)
══════════════════════════════════════════════════════ */
.navtabs {
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  padding: 0 var(--sp-6); display: flex; gap: var(--sp-1); overflow-x: auto;
  position: sticky; top: 68px; z-index: calc(var(--z-sticky) - 1);
}
.navtab {
  font-family: var(--font-display); font-size: var(--fs-md); font-weight: 600;
  letter-spacing: -0.014em; color: var(--text-2);
  padding: var(--sp-3) var(--sp-4); min-height: 46px;
  border: none; background: none; cursor: pointer;
  border-bottom: 2px solid transparent; white-space: nowrap;
  transition: color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
}
.navtab:hover { color: var(--text-bright); }
.navtab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 700; }

.main { padding: var(--sp-8) var(--sp-6) var(--sp-12); display: none; }
.main.active { display: block; }

/* ══════════════════════════════════════════════════════
   COMPONENTS
══════════════════════════════════════════════════════ */
.panel {
  background: var(--surface-1); border: 1px solid var(--line);
  border-radius: var(--r-lg); overflow: hidden; backdrop-filter: blur(2px);
}
.panel-hdr {
  padding: var(--sp-4) var(--sp-5); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--sp-3); flex-wrap: wrap;
}
.panel-title {
  font-family: var(--font-display); font-weight: 700; font-size: var(--fs-lg);
  letter-spacing: -0.020em; line-height: 1.3; color: var(--text-bright);
}
.panel-body { padding: var(--sp-5); }

.pill {
  display: inline-flex; align-items: center; gap: var(--sp-1);
  padding: 4px 10px; border-radius: var(--r-pill);
  font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 600;
  letter-spacing: .06em; border: 1px solid; white-space: nowrap;
}
.badge {
  display: inline-block; padding: 2px 8px; border-radius: var(--r-sm);
  font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 600; letter-spacing: .04em;
}

/* Stat cards */
.stat-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: var(--sp-4); margin-bottom: var(--sp-6);
}
.stat-card {
  background: var(--surface-1); border: 1px solid var(--line);
  border-radius: var(--r-lg); padding: var(--sp-5); backdrop-filter: blur(2px);
  transition: border-color var(--dur) var(--ease-out), background var(--dur) var(--ease-out);
}
.stat-card:hover { border-color: var(--line-strong); background: var(--surface-2); }
.stat-val {
  font-family: var(--font-display); font-size: var(--fs-4xl); font-weight: 800;
  line-height: 1; letter-spacing: -0.035em; font-variant-numeric: tabular-nums;
  margin-bottom: var(--sp-2);
}
.stat-label {
  font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 500;
  color: var(--text-dim); letter-spacing: .12em; text-transform: uppercase;
}

/* Layout helpers */
.two-col   { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: var(--sp-4); margin-bottom: var(--sp-6); }
.three-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: var(--sp-4); margin-bottom: var(--sp-6); }
.full-col  { margin-bottom: var(--sp-6); }

/* List rows — sidebar items, category buttons, matched pairs */
.row-list { display: flex; flex-direction: column; gap: var(--sp-2); }
.row-item {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4); background: var(--surface-2);
  border: 1px solid var(--line); border-radius: var(--r-md);
  cursor: pointer; min-height: 56px; width: 100%; text-align: left;
  font-family: var(--font-body); font-size: var(--fs-base); color: var(--text);
  transition: border-color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
}
.row-item:hover { background: var(--surface-3); border-color: var(--line-strong); transform: translateX(2px); }
.row-item.active { border-color: var(--primary); background: var(--primary-soft); }
.row-title {
  font-family: var(--font-display); font-weight: 650; font-size: var(--fs-md);
  letter-spacing: -0.015em; line-height: 1.35; color: var(--text-bright);
}
.row-meta {
  font-family: var(--font-mono); font-size: var(--fs-2xs);
  color: var(--text-dim); letter-spacing: .02em; margin-top: 2px;
}

/* Search + filter bar */
.filter-bar { display: flex; gap: var(--sp-2); margin-bottom: var(--sp-4); flex-wrap: wrap; align-items: center; }
.filter-bar input[type="text"] {
  flex: 1; min-width: 220px; min-height: 44px;
  background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--r-sm);
  padding: 0 var(--sp-4); color: var(--text-bright);
  font-family: var(--font-body); font-size: var(--fs-base); outline: none;
  transition: border-color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
}
.filter-bar input::placeholder { color: var(--text-dim); }
.filter-bar input:focus { border-color: var(--primary); background: var(--surface-2); }
.filter-btn {
  background: var(--surface-1); border: 1px solid var(--line); color: var(--text-2);
  padding: 0 var(--sp-4); min-height: 44px; border-radius: var(--r-sm);
  font-family: var(--font-body); font-size: var(--fs-sm); font-weight: 600; cursor: pointer;
  transition: color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
}
.filter-btn:hover { color: var(--text-bright); background: var(--surface-2); border-color: var(--line-strong); }
.filter-btn.active { background: var(--primary); border-color: var(--primary); color: var(--bg); font-weight: 700; }

/* Primary action button */
.btn {
  font-family: var(--font-body); font-size: var(--fs-base); font-weight: 650;
  min-height: 44px; padding: 0 var(--sp-5); border-radius: var(--r-sm); cursor: pointer;
  background: var(--primary); border: 1px solid var(--primary); color: var(--bg);
  transition: filter var(--dur-fast) var(--ease-out);
}
.btn:hover { filter: brightness(1.12); }
.btn-ghost { background: var(--surface-1); border-color: var(--line); color: var(--text-bright); }
.btn-ghost:hover { background: var(--surface-2); border-color: var(--line-strong); filter: none; }

/* Tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-lg); }
table.cs-table { width: 100%; border-collapse: collapse; }
.cs-table th {
  background: color-mix(in srgb, var(--bg) 92%, var(--surface-3));
  padding: var(--sp-3) var(--sp-4); text-align: left;
  font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 600;
  color: var(--text-2); letter-spacing: .12em; text-transform: uppercase;
  border-bottom: 1px solid var(--line-strong); position: sticky; top: 0; z-index: 2;
}
.cs-table td {
  padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--line);
  vertical-align: top; font-size: var(--fs-sm); line-height: 1.6;
}
.cs-table tr:hover td { background: var(--surface-2); }

/* Drill / quiz overlay — delete if drill mode is off */
.overlay {
  position: fixed; inset: 0; z-index: var(--z-overlay);
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  display: none; align-items: center; justify-content: center; padding: var(--sp-4);
}
.overlay.open { display: flex; }
.overlay-card {
  width: min(620px, 100%); background: var(--surface-2);
  border: 1px solid var(--line-strong); border-radius: var(--r-lg); padding: var(--sp-6);
}
.choice {
  display: block; width: 100%; text-align: left; margin-bottom: var(--sp-2);
  padding: var(--sp-3) var(--sp-4); min-height: 48px;
  background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--r-md);
  color: var(--text); font-family: var(--font-body); font-size: var(--fs-base); cursor: pointer;
  transition: border-color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
}
.choice:hover { border-color: var(--line-strong); background: var(--surface-2); }
/* Correct/wrong states pair a colour with a glyph — never colour alone */
.choice.correct { border-color: var(--u1); background: var(--u1s); color: var(--text-bright); }
.choice.correct::after { content: ' ✓'; font-weight: 700; }
.choice.wrong   { border-color: var(--danger); background: var(--u5s); color: var(--text-bright); }
.choice.wrong::after { content: ' ✕'; font-weight: 700; }

/* Scrollbar */
::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: var(--r-pill); border: 3px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }


/* ══════════════════════════════════════════════════════
   CYBER JEOPARDY — app styles (tokens only)
══════════════════════════════════════════════════════ */
.shell { grid-template-columns: minmax(0, 1fr); }
.main, .wrap, .view { min-width: 0; }
.view { display: none; }
.view.active { display: block; }
.wrap { max-width: 1480px; margin: 0 auto; }

.page-head { margin-bottom: var(--sp-6); }
.page-kicker {
  font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 600;
  letter-spacing: .12em; text-transform: uppercase; color: var(--primary); margin-bottom: var(--sp-2);
}
.page-title {
  font-family: var(--font-display); font-size: var(--fs-3xl); font-weight: 800;
  letter-spacing: -0.03em; line-height: 1.15; color: var(--text-bright);
}
.page-lede { color: var(--text-2); max-width: 70ch; margin-top: var(--sp-2); }

/* Setup */
.setup-section { padding: var(--sp-5); border-bottom: 1px solid var(--line); }
.setup-section:last-child { border-bottom: 0; }
.field-label {
  display: block; font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 600;
  letter-spacing: .12em; text-transform: uppercase; color: var(--text-dim); margin-bottom: var(--sp-3);
}
.field-help { font-size: var(--fs-sm); color: var(--text-2); margin-top: var(--sp-2); }
.opt-group { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.opt-group .filter-btn[aria-pressed="true"]::before { content: '✓ '; }
.team-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--sp-2); margin-top: var(--sp-3); }
.text-input {
  width: 100%; min-height: 44px; padding: 0 var(--sp-4);
  background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--r-sm);
  color: var(--text-bright); font-family: var(--font-body); font-size: var(--fs-base);
  transition: border-color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
}
.text-input:focus { border-color: var(--primary); background: var(--surface-2); }
.text-input.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; max-width: 200px; }
.resume-bar {
  display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap;
  padding: var(--sp-4) var(--sp-5); background: var(--primary-soft); border-bottom: 1px solid var(--line-strong);
}
.resume-bar p { flex: 1 1 260px; color: var(--text-bright); }
.setup-actions { display: flex; gap: var(--sp-3); flex-wrap: wrap; align-items: center; }
.btn-lg { min-height: 52px; padding: 0 var(--sp-8); font-size: var(--fs-md); }

/* Scoreboard */
.scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: var(--sp-3); margin-bottom: var(--sp-5); }
.score-card {
  background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: var(--sp-3) var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-1);
}
.score-name {
  font-family: var(--font-display); font-weight: 700; font-size: var(--fs-md); color: var(--text-bright);
  letter-spacing: -0.014em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.score-row { display: flex; align-items: center; gap: var(--sp-2); }
.score-val {
  flex: 1; font-family: var(--font-display); font-size: var(--fs-3xl); font-weight: 800;
  line-height: 1.1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; color: var(--primary);
}
.score-val.neg { color: var(--danger); }
.score-sub { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-dim); letter-spacing: .06em; }
.adj-btn {
  min-width: 44px; min-height: 44px; border-radius: var(--r-sm); cursor: pointer;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2);
  font-family: var(--font-mono); font-size: var(--fs-md); font-weight: 700;
  transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
}
.adj-btn:hover { background: var(--surface-3); border-color: var(--line-strong); color: var(--text-bright); }

/* Board */
.board-wrap { overflow-x: auto; margin-bottom: var(--sp-5); padding-bottom: var(--sp-1); }
.board {
  display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--sp-2);
  min-width: 640px;
}
.cat-hdr {
  min-height: 84px; padding: var(--sp-2) var(--sp-3);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-1);
  text-align: center; background: var(--surface-3); border: 1px solid var(--line-strong);
  border-radius: var(--r-md);
}
.cat-name {
  font-family: var(--font-display); font-weight: 750; font-size: var(--fs-sm);
  letter-spacing: -0.01em; line-height: 1.25; color: var(--text-bright); text-transform: uppercase;
}
.cat-topic { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--primary); letter-spacing: .08em; }
.cell {
  min-height: 76px; border-radius: var(--r-md); cursor: pointer;
  background: var(--surface-1); border: 1px solid var(--line);
  font-family: var(--font-mono); font-weight: 700; font-size: var(--fs-2xl);
  color: var(--primary); font-variant-numeric: tabular-nums; letter-spacing: .02em;
  transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
}
.cell:hover { background: var(--surface-3); border-color: var(--line-strong); transform: translateY(-2px); }
.cell.used {
  cursor: default; color: var(--text-dim); background: transparent;
  border-style: dashed; font-size: var(--fs-md); transform: none;
}
.cell.used:hover { background: transparent; border-color: var(--line); }

.toolbar { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; }
.toolbar .spacer { flex: 1 1 auto; }
.progress-tag {
  font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-2); letter-spacing: .06em;
  padding: var(--sp-2) var(--sp-3); border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-1);
}
.btn:disabled, .btn-ghost:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.board-done {
  display: none; margin-bottom: var(--sp-5); padding: var(--sp-4) var(--sp-5);
  border: 1px solid var(--primary); background: var(--primary-soft); border-radius: var(--r-lg);
  color: var(--text-bright); font-weight: 600;
}
.board-done.show { display: flex; gap: var(--sp-3); align-items: center; flex-wrap: wrap; justify-content: space-between; }

/* Clue overlay */
.clue-card {
  width: min(960px, 100%); max-height: calc(100dvh - var(--sp-8)); overflow-y: auto;
  padding: var(--sp-6) var(--sp-8);
}
.clue-meta { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; margin-bottom: var(--sp-4); }
.pill-primary { color: var(--primary); border-color: var(--line-strong); background: var(--primary-soft); }
.pill-accent  { color: var(--u3); border-color: var(--u3); background: var(--u3s); }
.clue-text {
  font-family: var(--font-display); font-weight: 650; font-size: var(--fs-2xl);
  line-height: 1.38; letter-spacing: -0.02em; color: var(--text-bright); margin: var(--sp-4) 0 var(--sp-5);
}
.clue-text.small { font-size: var(--fs-lg); color: var(--text); margin-top: var(--sp-2); }
.clue-log {
  font-family: var(--font-mono); font-size: var(--fs-sm); line-height: 1.7; white-space: pre;
  overflow-x: auto; color: var(--text-bright); background: var(--bg);
  border: 1px solid var(--line); border-left: 3px solid var(--primary);
  border-radius: var(--r-md); padding: var(--sp-3) var(--sp-4); margin-bottom: var(--sp-5);
}
.choice-list { margin-bottom: var(--sp-5); }
.choice .letter { font-family: var(--font-mono); font-weight: 700; color: var(--primary); margin-right: var(--sp-2); }
div.choice { cursor: default; }
div.choice:hover { border-color: var(--line); background: var(--surface-1); }
div.choice.correct:hover { border-color: var(--u1); background: var(--u1s); }
.choice:disabled { cursor: default; }

.timer { display: flex; align-items: center; gap: var(--sp-3); }
.timer-track { flex: 1; height: 8px; background: var(--surface-3); border-radius: var(--r-pill); overflow: hidden; }
.timer-fill { height: 100%; width: 100%; background: var(--primary); border-radius: var(--r-pill); transition: width 100ms linear; }
.timer.low .timer-fill { background: var(--danger); }
.timer-label {
  font-family: var(--font-mono); font-size: var(--fs-md); font-weight: 700; min-width: 64px; text-align: right;
  color: var(--text-bright); font-variant-numeric: tabular-nums;
}
.timer.low .timer-label { color: var(--danger); }

.answer-box {
  border: 1px solid var(--u1); background: var(--u1s); border-radius: var(--r-md);
  padding: var(--sp-4) var(--sp-5); margin-bottom: var(--sp-5);
}
.answer-box.miss { border-color: var(--danger); background: var(--u5s); }
.answer-label { font-family: var(--font-mono); font-size: var(--fs-2xs); letter-spacing: .12em; text-transform: uppercase; color: var(--text-2); margin-bottom: var(--sp-1); }
.answer-text { font-family: var(--font-display); font-size: var(--fs-xl); font-weight: 750; letter-spacing: -0.02em; line-height: 1.3; color: var(--text-bright); }
.answer-why { color: var(--text); margin-top: var(--sp-2); }
.answer-ek { margin-top: var(--sp-3); }

.award-title { font-family: var(--font-mono); font-size: var(--fs-2xs); letter-spacing: .12em; text-transform: uppercase; color: var(--text-dim); margin-bottom: var(--sp-2); }
.award-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: var(--sp-2); margin-bottom: var(--sp-5); }
.award-row {
  display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-2) var(--sp-3);
  background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--r-md);
}
.award-name { flex: 1; min-width: 0; font-weight: 650; color: var(--text-bright); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.award-sub { display: block; font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-dim); font-weight: 500; }
.mark-btn {
  min-width: 48px; min-height: 44px; padding: 0 var(--sp-2); border-radius: var(--r-sm); cursor: pointer;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2);
  font-family: var(--font-body); font-size: var(--fs-sm); font-weight: 700;
  transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
}
.mark-btn:hover { border-color: var(--line-strong); color: var(--text-bright); }
.mark-btn.ok[aria-pressed="true"]  { background: var(--u1s); border-color: var(--u1); color: var(--text-bright); }
.mark-btn.bad[aria-pressed="true"] { background: var(--u5s); border-color: var(--danger); color: var(--text-bright); }

.clue-actions { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; margin-top: var(--sp-5); }
.clue-actions .spacer { flex: 1 1 auto; }

.dd-banner {
  text-align: center; padding: var(--sp-6) 0 var(--sp-4);
  font-family: var(--font-display); font-weight: 800; font-size: var(--fs-4xl);
  letter-spacing: -0.035em; line-height: 1.05; color: var(--u3);
}
.dd-sub { text-align: center; color: var(--text-2); margin-bottom: var(--sp-6); }
.wager-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--sp-3); margin-bottom: var(--sp-5); }
.wager-item { display: flex; flex-direction: column; gap: var(--sp-1); }
.wager-item .field-label { margin-bottom: 0; }
.msg-error { color: var(--danger); font-size: var(--fs-sm); margin-top: var(--sp-2); min-height: 1.6em; }

.result-line {
  font-family: var(--font-display); font-weight: 750; font-size: var(--fs-lg); color: var(--text-bright);
  margin-bottom: var(--sp-3);
}

/* Results */
.podium { display: flex; flex-direction: column; gap: var(--sp-2); }
.podium-row {
  display: flex; align-items: center; gap: var(--sp-4); padding: var(--sp-3) var(--sp-5);
  background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--r-md);
}
.podium-row.first { border-color: var(--primary); background: var(--primary-soft); }
.podium-rank { font-family: var(--font-mono); font-weight: 700; color: var(--text-dim); min-width: 40px; }
.podium-row.first .podium-rank { color: var(--primary); }
.podium-name { flex: 1; font-family: var(--font-display); font-weight: 700; font-size: var(--fs-lg); color: var(--text-bright); }
.podium-score { font-family: var(--font-display); font-weight: 800; font-size: var(--fs-2xl); font-variant-numeric: tabular-nums; color: var(--text-bright); }
.winner-line {
  font-family: var(--font-display); font-weight: 800; font-size: var(--fs-3xl); letter-spacing: -0.03em;
  color: var(--text-bright); margin-bottom: var(--sp-5);
}

.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

@media (min-width: 1280px) {
  .cell { min-height: 100px; font-size: var(--fs-3xl); }
  .cat-name { font-size: var(--fs-md); }
  .cat-hdr { min-height: 96px; }
  .clue-text { font-size: var(--fs-3xl); }
}
@media (max-width: 820px) {
  .page-title { font-size: var(--fs-2xl); }
  .clue-card { padding: var(--sp-5) var(--sp-4); }
  .clue-text { font-size: var(--fs-xl); }
  .dd-banner { font-size: var(--fs-3xl); }
  .cell { min-height: 64px; font-size: var(--fs-xl); }
  .score-val { font-size: var(--fs-2xl); }
}
@media print {
  .board-wrap, .toolbar, .scores { display: none !important; }
}

.clue-card .setup-section { padding: var(--sp-3) 0; border-bottom: 0; }

/* ══════════════════════════════════════════════════════
   RESPONSIVE
══════════════════════════════════════════════════════ */
@media (max-width: 1080px) {
  .theme-label { display: none; }
  .topbar-tag { display: none; }
}
@media (max-width: 820px) {
  .topbar { padding: var(--sp-3) var(--sp-4); }
  .navtabs { padding: 0 var(--sp-4); top: 0; position: static; }
  .main { padding: var(--sp-6) var(--sp-4) var(--sp-10); }
  .theme-switcher { order: 5; width: 100%; justify-content: space-between; }
  .theme-btn { flex: 1; text-align: center; padding: 7px 4px; }
  .brand-title { font-size: var(--fs-md); }
  .stat-val { font-size: var(--fs-3xl); }
  .two-col, .three-col { grid-template-columns: 1fr; }
}

/* ══════════════════════════════════════════════════════
   REDUCED MOTION / PRINT
══════════════════════════════════════════════════════ */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  #matrix-rain, .atmos { display: none; }
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}
@media print {
  .topbar, .navtabs, #matrix-rain, .atmos, .overlay { display: none !important; }
  body { background: #fff; color: #000; }
  .main { display: block !important; }
  .panel, .stat-card { border-color: #ccc; background: #fff; break-inside: avoid; }
  .panel-title, .stat-val, .row-title { color: #000; }
}
</style>

// ══════════════════════════════════════════
//  MATRIX RAIN — repalettes itself per theme
// ══════════════════════════════════════════
(function(){
  const canvas = document.getElementById('matrix-rain');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const CHARS = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEF<>{}[]|/\\';
  let cols, drops;
  function resize() {
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    cols = Math.floor(canvas.width / 16);
    drops = Array.from({length: cols}, () => Math.random() * -50);
  }
  resize();
  window.addEventListener('resize', resize);
  let PAL = {bg: '#05070a', primary: '#35d67d', bright: '#eafff2'};
  window.csRefreshRainPalette = function () {
    const cs = getComputedStyle(document.body);
    PAL = {
      bg:      cs.getPropertyValue('--bg').trim()          || PAL.bg,
      primary: cs.getPropertyValue('--primary').trim()     || PAL.primary,
      bright:  cs.getPropertyValue('--text-bright').trim() || PAL.bright
    };
  };
  window.csRefreshRainPalette();
  function draw() {
    ctx.globalAlpha = 0.18; ctx.fillStyle = PAL.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 1; ctx.font = '13px JetBrains Mono, monospace';
    drops.forEach((y, i) => {
      const ch = CHARS[Math.floor(Math.random() * CHARS.length)];
      ctx.fillStyle = Math.random() > 0.96 ? PAL.bright : PAL.primary;
      ctx.fillText(ch, i * 16, y * 16);
      if (y * 16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i] += 0.5 + Math.random() * 0.5;
    });
  }
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) setInterval(draw, 50);
})();

// ══════════════════════════════════════════
//  THEME CONTROLLER — persists across apps
// ══════════════════════════════════════════
const CS_THEMES = ['matrix', 'arctic', 'crimson', 'tokyo', 'galaxy'];

function csSetTheme(name, persist) {
  if (!CS_THEMES.includes(name)) name = 'matrix';
  document.body.classList.remove(...CS_THEMES);
  document.body.classList.add(name);
  document.querySelectorAll('.theme-btn').forEach(b => {
    const on = b.dataset.theme === name;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = getComputedStyle(document.body).getPropertyValue('--bg').trim();
  if (window.csRefreshRainPalette) window.csRefreshRainPalette();
  if (persist !== false) { try { localStorage.setItem('cs_theme', name); } catch (e) {} }
}

(function initTheme() {
  let saved = 'matrix';
  try { saved = localStorage.getItem('cs_theme') || 'matrix'; } catch (e) {}
  csSetTheme(saved, false);
  document.querySelectorAll('.theme-btn').forEach(b => {
    b.addEventListener('click', () => csSetTheme(b.dataset.theme));
  });
})();

    { name: 'Wireless & Policy', topic: '3.2', clues: [

}

function pickDailyDoubles(on) {
  if (!on) return [];
  const cols = shuffle(SET.categories.map((_, i) => i)).slice(0, DD_COUNT);
  return cols.map(c => c + '-' + (1 + Math.floor(Math.random() * (SET.values.length - 1))));
}

function startGame() {
  const saved = loadGame(SET.id);
  if (saved && saved.phase !== 'done' && !confirm('Start over? The saved game for this unit will be replaced.')) return;
  const n = cfg.mode === 'solo' ? 1 : cfg.teamCount;
  G = {
    v: 1, setId: SET.id, mode: cfg.mode,
    opts: { dd: cfg.dd, final: cfg.final, deduct: cfg.deduct, timer: cfg.timer, choices: cfg.mode === 'solo' ? true : cfg.choices },
    teams: Array.from({ length: n }, (_, i) => ({ name: cfg.mode === 'solo' ? 'Your score' : ((cfg.names[i] || '').trim() || 'Team ' + (i + 1)), score: 0 })),
    used: {}, dd: pickDailyDoubles(cfg.dd), history: [], phase: 'board', solo: { right: 0, wrong: 0 }
  };
  saveGame(); enterBoard();
}

// ── board ──────────────────────────────────

function adjust(i, d) {

// ── overlay plumbing ───────────────────────

  if (!f.length) return;

  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }

// ── timer ──────────────────────────────────
function timerEl(sec) {
  if (!sec) return null;
  return h('div', { class: 'timer', id: 'timer' },
    h('div', { class: 'timer-track', 'aria-hidden': 'true' }, h('div', { class: 'timer-fill', id: 'timer-fill' })),
    h('div', { class: 'timer-label', id: 'timer-label', role: 'timer', 'aria-live': 'off' }, sec + 's'));
}
function startTimer(sec) {

    const left = Math.max(0, end - Date.now());
    const fill = $('timer-fill'), lab = $('timer-label'), wrap = $('timer');

// ── clue flow ──────────────────────────────
function openClue(ci, r) {
  const key = ci + '-' + r, cat = SET.categories[ci], clue = cat.clues[r];
  CUR = { ci, r, key, cat, clue, value: SET.values[r], isDD: G.dd.includes(key),

  CUR.order.forEach((ci, pos) => {
    const letter = 'ABCD'[pos];

    if (revealed) {
      if (ci === CUR.clue.correct) cls += ' correct';
      else if (ci === CUR.picked) cls += ' wrong';
    }
    const kids = [h('span', { class: 'letter' }, letter + '.'), CUR.clue.choices[ci]];

function renderClue() {
  const c = $('clue-card'); c.innerHTML = '';

  if (CUR.stage === 'dd') {
    const max = ddMax();
    const teamSel = G.mode === 'team' ? h('div', { class: 'setup-section' },
      h('span', { class: 'field-label', id: 'lbl-ddteam' }, 'Which team found it?'),
      h('div', { class: 'opt-group', role: 'group', 'aria-labelledby': 'lbl-ddteam' },
        G.teams.map((t, i) => toggleBtn(t.name, CUR.ddTeam === i, () => { CUR.ddTeam = i; renderClue(); })))) : null;
    c.append(
      h('h2', { class: 'dd-banner', id: 'clue-heading' }, 'DAILY DOUBLE'),
      h('p', { class: 'dd-sub' }, CUR.cat.name + ' · wager up to ' + fmt(max) + ' points'),
      teamSel,
      h('div', { class: 'setup-section' },
        h('label', { class: 'field-label', for: 'dd-wager' }, 'Wager (0 to ' + max + ')'),
        h('input', { class: 'text-input num', id: 'dd-wager', type: 'number', min: '0', max: String(max), step: '50', value: String(Math.min(CUR.value, max)), inputmode: 'numeric', 'data-autofocus': true }),
        h('div', { class: 'msg-error', id: 'dd-err', role: 'alert' })),
      h('div', { class: 'clue-actions' },
        h('button', { type: 'button', class: 'btn', onclick: lockWager }, 'Lock wager & show clue'),
        h('span', { class: 'spacer' }),
        h('button', { type: 'button', class: 'btn btn-ghost', onclick: () => { closeOverlay(); refocusCell(); } }, 'Put clue back'))
    );
    focusFirst(); return;
  }

  const revealed = CUR.stage === 'reveal';
  c.append(metaRow(h('span', { class: 'pill pill-accent' }, (SET.ekLabel ?? 'EK ') + clue.ek)));
  if (!revealed) { const t = timerEl(G.opts.timer); if (t) c.append(t); }
  c.append(h('h2', { class: 'clue-text' + (revealed ? ' small' : ''), id: 'clue-heading' }, clue.q));

    h('div', { class: 'answer-label' }, 'Correct response'),
    h('div', { class: 'answer-text' }, clue.a),
    h('p', { class: 'answer-why' }, clue.why)));

  if (G.mode === 'team') c.append(awardEl());

    h('span', { class: 'spacer' }),
    h('button', { type: 'button', class: 'btn', 'data-autofocus': G.mode === 'solo' ? true : null, onclick: finishClue }, 'Done · back to board')));

function awardEl() {

  const teams = CUR.isDD ? [CUR.ddTeam] : G.teams.map((_, i) => i);
  teams.forEach(i => {
    const t = G.teams[i], m = CUR.marks[i];

  });
  return h('div', null,
    h('div', { class: 'award-title' }, CUR.isDD ? 'Score the Daily Double' : 'Who got it? (tap again to clear)'), grid);
}
function setMark(i, m) {
  if (CUR.marks[i] === m) delete CUR.marks[i]; else {
    if (m === 'ok' && !CUR.isDD) for (const k of Object.keys(CUR.marks)) if (CUR.marks[k] === 'ok') delete CUR.marks[k];
    CUR.marks[i] = m;
  }
  const y = $('clue-card').scrollTop;
  renderClue();
  $('clue-card').scrollTop = y;
  const b = $('clue-card').querySelector('.mark-btn.' + m + '[aria-label^="' + CSS.escape(G.teams[i].name) + '"]');
  if (b) b.focus({ preventScroll: true });
}
function ddMax() {
  const score = G.mode === 'solo' ? G.teams[0].score : G.teams[CUR.ddTeam].score;
  return Math.max(score, maxValue());
}
function lockWager() {
  const inp = $('dd-wager'), max = ddMax(), w = Math.floor(Number(inp.value));
  if (!Number.isFinite(w) || w < 0 || w > max) { $('dd-err').textContent = 'Enter a whole number from 0 to ' + max + '.'; inp.focus(); return; }
  CUR.wager = w; CUR.stage = 'clue'; renderClue();
}
function soloDelta() {
  const amt = CUR.isDD ? CUR.wager : CUR.value;
  if (CUR.picked === CUR.clue.correct) return amt;
  if (CUR.picked === -1) return CUR.isDD ? -amt : 0;
  return (CUR.isDD || G.opts.deduct) ? -amt : 0;
}
function soloPick(ci) { stopTimer(); CUR.picked = ci; CUR.stage = 'reveal'; renderClue(); }
function finishClue() {
  const deltas = {}; let solo = null;
  const amt = CUR.isDD ? CUR.wager : CUR.value;
  if (G.mode === 'solo') {
    const d = soloDelta(); if (d) deltas[0] = d;
    const right = CUR.picked === CUR.clue.correct;
    solo = { right: right ? 1 : 0, wrong: right ? 0 : 1 };
    G.solo.right += solo.right; G.solo.wrong += solo.wrong;
  } else {
    for (const [i, m] of Object.entries(CUR.marks)) {
      if (m === 'ok') deltas[i] = amt;
      else if (m === 'bad' && (CUR.isDD || G.opts.deduct)) deltas[i] = -amt;
    }
  }
  for (const [i, d] of Object.entries(deltas)) G.teams[i].score += d;
  G.used[CUR.key] = true;
  G.history.push({ key: CUR.key, deltas, solo });
  saveGame(); closeOverlay(); renderBoard(); refocusCell();
}
function refocusCell() {
  const cells = [...document.querySelectorAll('.cell')];
  const here = CUR && document.querySelector('.cell[data-key="' + CUR.key + '"]');
  const target = (here && !here.classList.contains('used')) ? here : (cells.find(x => !x.classList.contains('used')) || $('btn-final'));
  if (target) target.focus({ preventScroll: true });
  CUR = null;
}

// ── final jeopardy ─────────────────────────
function openFinal() {
  G.phase = 'final'; saveGame();
  FIN = { stage: 'wager', wagers: G.teams.map(() => 0), marks: {}, picked: null, order: shuffle([0, 1, 2, 3]) };
  openOverlay(); renderFinal();
}
function renderFinal() {
  const c = $('clue-card'); c.innerHTML = '';
  const F = SET.final;
  if (FIN.stage === 'wager') {
    const grid = h('div', { class: 'wager-grid' });
    G.teams.forEach((t, i) => {
      const max = Math.max(t.score, 0), id = 'fw-' + i;
      grid.append(h('div', { class: 'wager-item' },
        h('label', { class: 'field-label', for: id }, t.name + ' · max ' + fmt(max)),
        max > 0
          ? h('input', { class: 'text-input num', id, type: 'number', min: '0', max: String(max), step: '50', value: '0', inputmode: 'numeric', 'data-autofocus': i === 0 ? true : null })
          : h('p', { class: 'field-help' }, 'Score is 0 or less, so this team sits out the wager.')));
    });
    c.append(
      h('h2', { class: 'dd-banner', id: 'clue-heading' }, 'FINAL JEOPARDY'),
      h('p', { class: 'dd-sub' }, 'Category: ' + F.category),
      h('p', { class: 'field-help' }, G.mode === 'team' ? 'Teams write their wagers secretly, then enter them here.' : 'Wager any amount up to your score.'),
      grid, h('div', { class: 'msg-error', id: 'fw-err', role: 'alert' }),
      h('div', { class: 'clue-actions' },
        h('button', { type: 'button', class: 'btn', onclick: lockFinalWagers }, 'Lock wagers & show clue'),
        h('span', { class: 'spacer' }),
        h('button', { type: 'button', class: 'btn btn-ghost', onclick: () => { G.phase = 'board'; saveGame(); closeOverlay(); renderBoard(); } }, 'Back to board')));
    focusFirst(); return;
  }
  const revealed = FIN.stage === 'reveal';
  c.append(h('div', { class: 'clue-meta' },
    h('span', { class: 'pill pill-primary' }, 'FINAL JEOPARDY'),
    h('span', { class: 'pill pill-primary' }, F.category.toUpperCase()),
    h('span', { class: 'pill pill-accent' }, (SET.ekLabel ?? 'EK ') + F.ek)));
  if (!revealed) { const t = timerEl(G.opts.timer || 30); if (t) c.append(t); }
  c.append(h('h2', { class: 'clue-text' + (revealed ? ' small' : ''), id: 'clue-heading' }, F.q));

  if (G.opts.choices) {
    const list = h('div', { class: 'choice-list', role: 'list' });
    FIN.order.forEach((ci, pos) => {
      let cls = 'choice';
      if (revealed) { if (ci === F.correct) cls += ' correct'; else if (ci === FIN.picked) cls += ' wrong'; }
      const kids = [h('span', { class: 'letter' }, 'ABCD'[pos] + '.'), F.choices[ci]];
      list.append(G.mode === 'solo' && !revealed
        ? h('button', { type: 'button', class: cls, onclick: () => { stopTimer(); FIN.picked = ci; FIN.marks[0] = ci === F.correct ? 'ok' : 'bad'; FIN.stage = 'reveal'; renderFinal(); } }, ...kids)
        : h('div', { class: cls, role: 'listitem' }, ...kids));
    });
    c.append(list);
  }
  if (!revealed) {
    if (G.mode === 'team') c.append(h('div', { class: 'clue-actions' },
      h('button', { type: 'button', class: 'btn', 'data-autofocus': true, onclick: () => { stopTimer(); FIN.stage = 'reveal'; renderFinal(); } }, 'Reveal answer')));
    focusFirst(); startTimer(G.opts.timer || 30); return;
  }
  if (G.mode === 'solo') c.append(h('p', { class: 'result-line', role: 'status' },
    FIN.marks[0] === 'ok' ? '✓ Correct! +' + fmt(FIN.wagers[0]) : '✕ Not quite. ' + (FIN.wagers[0] ? '−' + fmt(FIN.wagers[0]) : 'No points lost')));
  c.append(h('div', { class: 'answer-box' + (G.mode === 'solo' && FIN.marks[0] !== 'ok' ? ' miss' : '') },
    h('div', { class: 'answer-label' }, 'Correct response'),
    h('div', { class: 'answer-text' }, F.a), h('p', { class: 'answer-why' }, F.why)));
  if (G.mode === 'team') {
    const grid = h('div', { class: 'award-grid' });
    G.teams.forEach((t, i) => {
      const w = FIN.wagers[i], m = FIN.marks[i];
      grid.append(h('div', { class: 'award-row' },
        h('span', { class: 'award-name' }, t.name, h('span', { class: 'award-sub' }, 'wagered ' + fmt(w))),
        h('button', { type: 'button', class: 'mark-btn ok', 'aria-pressed': m === 'ok' ? 'true' : 'false', 'aria-label': t.name + ' correct',
          onclick: () => { FIN.marks[i] = m === 'ok' ? undefined : 'ok'; renderFinal(); } }, '✓'),
        h('button', { type: 'button', class: 'mark-btn bad', 'aria-pressed': m === 'bad' ? 'true' : 'false', 'aria-label': t.name + ' wrong',
          onclick: () => { FIN.marks[i] = m === 'bad' ? undefined : 'bad'; renderFinal(); } }, '✕')));
    });
    c.append(h('div', { class: 'award-title' }, 'Mark each team'), grid);
  }
  c.append(h('div', { class: 'clue-actions' }, h('span', { class: 'spacer' }),
    h('button', { type: 'button', class: 'btn', 'data-autofocus': G.mode === 'solo' ? true : null, onclick: applyFinal }, 'Apply & show final scores')));
  focusFirst();
}
function lockFinalWagers() {
  const err = $('fw-err'); err.textContent = '';
  for (let i = 0; i < G.teams.length; i++) {
    const inp = $('fw-' + i); if (!inp) { FIN.wagers[i] = 0; continue; }
    const max = Math.max(G.teams[i].score, 0), w = Math.floor(Number(inp.value));
    if (!Number.isFinite(w) || w < 0 || w > max) { err.textContent = G.teams[i].name + ': enter a whole number from 0 to ' + max + '.'; inp.focus(); return; }
    FIN.wagers[i] = w;
  }
  FIN.stage = 'clue'; renderFinal();
}
function applyFinal() {
  const deltas = {};
  G.teams.forEach((t, i) => {
    const w = FIN.wagers[i];
    if (!w) return;
    if (FIN.marks[i] === 'ok') deltas[i] = w;
    else if (FIN.marks[i] === 'bad') deltas[i] = -w;
  });
  for (const [i, d] of Object.entries(deltas)) G.teams[i].score += d;
  if (G.mode === 'solo') { const r = FIN.marks[0] === 'ok'; G.solo.right += r ? 1 : 0; G.solo.wrong += r ? 0 : 1; }
  G.history.push({ key: 'final', deltas });
  G.phase = 'done'; saveGame(); closeOverlay(); renderDone(); showView('done');
  const b = $('done-body').querySelector('button'); if (b) b.focus({ preventScroll: true });
}

// ── results ────────────────────────────────
function renderDone() {
  const body = $('done-body'); body.innerHTML = '';
  const ranked = G.teams.map((t, i) => ({ ...t, i })).sort((a, b) => b.score - a.score);
  const top = ranked[0].score, winners = ranked.filter(t => t.score === top);
  if (G.mode === 'solo') {
    const total = G.solo.right + G.solo.wrong;
    body.append(h('p', { class: 'winner-line' }, 'Final score: ' + fmt(top)),
      h('p', { class: 'page-lede' }, G.solo.right + ' of ' + total + ' correct' + (total ? ' (' + Math.round(G.solo.right / total * 100) + '%)' : '') + '.'));
  } else {
    body.append(h('p', { class: 'winner-line', role: 'status' }, winners.length > 1 ? 'It’s a tie: ' + winners.map(w => w.name).join(' & ') + '!' : winners[0].name + ' wins!'));
    const pod = h('div', { class: 'podium' });
    let rank = 0, prev = null;
    ranked.forEach((t, k) => {
      if (t.score !== prev) { rank = k + 1; prev = t.score; }
      pod.append(h('div', { class: 'podium-row' + (t.score === top ? ' first' : '') },
        h('span', { class: 'podium-rank' }, '#' + rank), h('span', { class: 'podium-name' }, t.name), h('span', { class: 'podium-score' }, fmt(t.score))));
    });
    body.append(pod);
  }
  body.append(h('div', { class: 'clue-actions' },
    h('button', { type: 'button', class: 'btn', onclick: () => { clearGame(SET.id); startGameFresh(); } }, G.mode === 'team' ? 'Rematch (same teams)' : 'Play again'),
    h('button', { type: 'button', class: 'btn btn-ghost', onclick: () => { clearGame(SET.id); G = null; renderSetup(); showView('setup'); } }, 'Back to setup')));
}
function startGameFresh() {
  const keepNames = G.teams.map(t => t.name), mode = G.mode, opts = G.opts;
  G = { v: 1, setId: SET.id, mode, opts, teams: keepNames.map(n => ({ name: n, score: 0 })),
        used: {}, dd: pickDailyDoubles(opts.dd), history: [], phase: 'board', solo: { right: 0, wrong: 0 } };
  saveGame(); enterBoard();
}

// ── wire up ────────────────────────────────
$('btn-undo').addEventListener('click', undo);
$('btn-final').addEventListener('click', goFinal);
$('btn-new').addEventListener('click', () => {
  if (!confirm('End this game and go back to setup? Scores will be cleared.')) return;
  clearGame(SET.id); G = null; renderSetup(); showView('setup');
});

renderTabs(); applySetChrome(); renderSetup();

</script>
